<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>tamsyam</title>
<style>
:root{
  --font:ui-monospace,"JetBrains Mono","Cascadia Code","SF Mono",Menlo,Consolas,monospace;
  --bg:#ffffff;--side:#f8f8f9;--card:#ffffff;--soft:#f4f5f7;--hover:#eef0f3;--sel:#e8ecf3;
  --fg:#1f2328;--fg2:#4b5563;--muted:#8a909c;--line:#e6e8ec;--grid:#eef0f3;
  --accent:#2563eb;--accent-soft:#eaf1fe;--ok:#16a34a;--warn:#b97800;--danger:#dc2626;
  --shadow:0 1px 2px rgba(16,24,40,.04),0 4px 16px rgba(16,24,40,.06);
  --c-2xx:#0ca30c;--c-3xx:#2a78d6;--c-4xx:#fab219;--c-5xx:#d03b3b;--c-in:#2a78d6;--c-out:#eb6834;
}
@media (prefers-color-scheme:dark){:root{
  --bg:#111317;--side:#15181d;--card:#181b21;--soft:#1f232a;--hover:#22262e;--sel:#262c37;
  --fg:#e6e8ee;--fg2:#b4bac6;--muted:#7d8594;--line:#262a33;--grid:#22262e;
  --accent:#6b9bff;--accent-soft:#1c2740;--ok:#3ccf7a;--warn:#fab219;--danger:#ff6b6b;
  --shadow:0 1px 2px rgba(0,0,0,.3),0 8px 24px rgba(0,0,0,.35);
  --c-3xx:#3987e5;--c-in:#3987e5;--c-out:#d95926;
}}
*{box-sizing:border-box}
html,body{margin:0;height:100%}
body{background:var(--bg);color:var(--fg);font:13.5px/1.55 var(--font);-webkit-font-smoothing:antialiased}
a{color:var(--accent);text-decoration:none}
button,select,input{font:inherit;color:inherit}
code,.mono{font-family:var(--font)}

/* layout */
.app{display:grid;grid-template-columns:240px minmax(0,1fr);min-height:100vh}
.side{background:var(--side);border-right:1px solid var(--line);padding:16px 12px;display:flex;flex-direction:column;gap:4px;position:sticky;top:0;height:100vh}
.brand{font-size:22px;font-weight:700;letter-spacing:-.02em;padding:2px 8px 10px}
.server{display:flex;align-items:center;gap:8px;border:1px solid var(--line);background:var(--card);border-radius:8px;padding:7px 10px;margin:0 0 12px;font-size:12.5px;overflow:hidden}
.server .av{flex:none;width:20px;height:20px;border-radius:50%;background:#fdf1d8;color:#b26b00;display:grid;place-items:center;font-size:11px;font-weight:700}
.server span:last-child{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.group{font-size:10.5px;letter-spacing:.06em;color:var(--muted);text-transform:uppercase;padding:12px 8px 4px}
.nav a{display:flex;align-items:center;gap:10px;padding:7px 8px;border-radius:7px;color:var(--fg2)}
.nav a:hover{background:var(--hover);color:var(--fg)}
.nav a.on{background:var(--sel);color:var(--fg);font-weight:600}
.nav svg{width:16px;height:16px;flex:none}
.nav .count{margin-left:auto;font-size:11px;color:var(--muted)}
.side .foot{margin-top:auto;font-size:11.5px;color:var(--muted);padding:8px;display:flex;justify-content:space-between}
.page{padding:48px 40px 64px;max-width:1120px;width:100%;margin:0 auto;min-width:0}
h1{font-size:30px;line-height:1.2;font-weight:700;letter-spacing:-.02em;margin:0 0 8px}
.lead{color:var(--fg2);margin:0 0 28px}
h2{font-size:15px;margin:32px 0 12px;font-weight:700}
@media (max-width:860px){
  .app{grid-template-columns:minmax(0,1fr);grid-template-rows:auto 1fr}
  .side{position:sticky;top:0;z-index:5;height:auto;min-width:0;flex-direction:column;align-items:stretch;padding:10px 12px 6px;gap:4px;border-right:0;border-bottom:1px solid var(--line)}
  .brand{padding:0 4px;font-size:18px}.server,.group,.side .foot{display:none}
  .nav{display:flex;gap:2px;overflow-x:auto;min-width:0;scrollbar-width:none}.nav a{white-space:nowrap;padding:6px 10px}.nav .count{margin-left:4px}
  .page{padding:24px 16px 48px}h1{font-size:24px}
}

/* building blocks */
.card{background:var(--card);border:1px solid var(--line);border-radius:12px}
.card.raised{box-shadow:var(--shadow)}
.btn{display:inline-flex;align-items:center;gap:6px;border:1px solid var(--line);background:var(--card);border-radius:7px;padding:6px 12px;cursor:pointer;white-space:nowrap}
.btn:hover{border-color:var(--muted)}
.btn.primary{background:var(--accent);border-color:var(--accent);color:#fff}
.btn.outline{border-color:var(--accent);color:var(--accent)}
.btn.danger{color:var(--danger)}
.btn.sm{padding:3px 9px;font-size:12px}
.btn:disabled{opacity:.5;cursor:default}
.btn svg{width:14px;height:14px}
input,select{border:1px solid var(--line);background:var(--card);border-radius:7px;padding:6px 10px}
input:focus,select:focus,.btn:focus-visible{outline:2px solid var(--accent-soft);border-color:var(--accent)}
.muted{color:var(--muted)}.fg2{color:var(--fg2)}
.dot{display:inline-block;width:8px;height:8px;border-radius:50%;background:var(--ok);flex:none}
.badge{display:inline-block;font-size:11px;padding:1px 7px;border:1px solid var(--line);border-radius:999px;color:var(--fg2);background:var(--soft)}
.badge.blue{color:var(--accent);border-color:transparent;background:var(--accent-soft)}
.s2xx{color:var(--ok)}.s3xx{color:var(--c-3xx)}.s4xx{color:var(--warn)}.s5xx{color:var(--danger)}
.empty{padding:28px 20px;color:var(--muted);text-align:center}
table{width:100%;border-collapse:collapse}
th,td{text-align:left;padding:10px 16px;border-bottom:1px solid var(--line);white-space:nowrap}
th{font-weight:600;font-size:12px;background:var(--soft);color:var(--fg2)}
tr:last-child td{border-bottom:0}
td.num,th.num{text-align:right;font-variant-numeric:tabular-nums}
.tablewrap{overflow-x:auto;border-radius:12px}
.copy{position:relative;display:flex;align-items:center;gap:8px;background:var(--soft);border:1px solid var(--line);border-radius:8px;padding:8px 10px}
.copy code{flex:1;min-width:0;overflow-x:auto;white-space:nowrap;font-size:12.5px;scrollbar-width:thin}
.copy code .k{color:#c2410c}.copy code .f{color:#a16207}.copy code .n{color:#be185d}
@media (prefers-color-scheme:dark){.copy code .k{color:#fb923c}.copy code .f{color:#facc15}.copy code .n{color:#f472b6}}
.iconbtn{flex:none;border:0;background:none;cursor:pointer;color:var(--muted);padding:2px;display:grid;place-items:center;border-radius:5px}
.iconbtn:hover{color:var(--fg);background:var(--hover)}
.iconbtn svg{width:16px;height:16px}
.toast{position:fixed;bottom:20px;left:50%;transform:translateX(-50%);background:var(--fg);color:var(--bg);padding:8px 14px;border-radius:8px;font-size:12.5px;z-index:50;opacity:0;transition:opacity .2s;pointer-events:none}
.toast.on{opacity:1}

/* start page */
.quick{padding:20px}
.quick .eyebrow{color:var(--accent);font-size:12px}
.quick h3{font-size:19px;margin:4px 0 4px}
.steps{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:14px;margin-top:16px}
@media (max-width:760px){.steps{grid-template-columns:1fr}}
.step{border:1px solid var(--line);border-radius:10px;padding:14px;display:grid;gap:10px;align-content:start;min-width:0}
.step>*,.copy{min-width:0}
.step.hl{background:var(--accent-soft);border-color:color-mix(in srgb,var(--accent) 30%,transparent)}
.step .t{display:flex;align-items:center;gap:8px;font-weight:600}
.stepnum{width:20px;height:20px;border-radius:50%;display:grid;place-items:center;font-size:11px;border:1px solid var(--line);background:var(--card)}
.step.hl .stepnum{background:var(--accent);color:#fff;border-color:var(--accent)}
.tabs{display:flex;gap:4px}
.tabs button{border:0;background:none;padding:2px 8px;border-radius:6px;cursor:pointer;color:var(--muted);font-size:12px}
.tabs button.on{background:var(--soft);color:var(--fg)}
.examples{font-size:12px;color:var(--fg2);display:grid;gap:4px}
.examples code{color:var(--fg)}
.tiles{display:grid;grid-template-columns:repeat(auto-fit,minmax(170px,1fr));gap:12px}
.tile{padding:16px}
.tile .v{font-size:24px;font-weight:700;font-variant-numeric:tabular-nums;line-height:1.25}
.tile .l{font-size:12px;color:var(--muted);margin-top:2px}
.actions{display:flex;flex-wrap:wrap;gap:10px;margin:20px 0 4px}

/* tunnels page */
.tlist{display:grid;gap:10px}
.trow{display:grid;grid-template-columns:minmax(0,1fr) auto;gap:16px;align-items:center;padding:16px 20px;cursor:pointer;transition:border-color .15s}
.trow:hover{border-color:var(--muted)}
.trow .url{display:flex;align-items:center;gap:8px;font-size:16px;min-width:0}
.trow .url span{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.trow .sub{display:flex;align-items:center;gap:8px;margin-top:4px;color:var(--muted);font-size:12px;flex-wrap:wrap}
.trow .meta{display:flex;gap:22px;text-align:right;font-size:12px;color:var(--muted)}
.trow .meta b{display:block;color:var(--fg);font-weight:600;font-size:13px;font-variant-numeric:tabular-nums}
@media (max-width:760px){.trow{grid-template-columns:1fr}.trow .meta{text-align:left}}

/* drawer */
.scrim{position:fixed;inset:0;background:rgba(15,18,24,.25);z-index:20;opacity:0;pointer-events:none;transition:opacity .15s}
.scrim.on{opacity:1;pointer-events:auto}
.drawer{position:fixed;top:0;right:0;bottom:0;width:min(760px,100%);background:var(--card);border-left:1px solid var(--line);box-shadow:var(--shadow);z-index:21;transform:translateX(100%);transition:transform .2s ease;display:flex;flex-direction:column}
.drawer.on{transform:none}
.dhead{display:flex;justify-content:space-between;align-items:center;padding:20px 24px 8px}
.dhead h3{margin:0;font-size:20px}
.dbody{overflow:auto;padding:8px 24px 32px;flex:1}
.addr{display:flex;align-items:center;justify-content:center;gap:10px;background:var(--soft);border-radius:10px;padding:16px;font-size:17px;text-align:center;word-break:break-all;margin-bottom:16px}
.props{width:100%;margin-bottom:16px}
.props td{padding:9px 0;border-bottom:1px solid var(--line);white-space:normal}
.props td:first-child{color:var(--fg2);width:42%}
.props td:last-child{text-align:right;word-break:break-all}
.dtiles{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:8px;margin-bottom:16px}
.dtiles .tile{padding:10px 12px;background:var(--soft);border-radius:8px}
.dtiles .tile .v{font-size:17px}
@media (max-width:600px){.dtiles{grid-template-columns:repeat(2,minmax(0,1fr))}}
.dsec{display:flex;justify-content:space-between;align-items:center;margin:20px 0 8px}
.dsec h4{margin:0;font-size:14px}
.reqs td{padding:8px 10px;cursor:pointer}.reqs td:first-child{padding-left:12px}
.reqs tr:hover td{background:var(--hover)}
.reqs .path{max-width:330px;overflow:hidden;text-overflow:ellipsis}
.kv td{padding:3px 10px 3px 0;border:0;white-space:normal;vertical-align:top;font-size:12.5px}
.kv td:first-child{color:var(--fg2);white-space:nowrap}
.kv td:last-child{word-break:break-all}
h5{font-size:11.5px;margin:18px 0 6px;color:var(--muted);font-weight:600;text-transform:uppercase;letter-spacing:.05em}
pre{margin:6px 0 0;padding:12px;background:var(--soft);border-radius:8px;overflow:auto;max-height:360px;font:12px/1.5 var(--font);white-space:pre-wrap;word-break:break-all}
.note{font-size:12px;color:var(--muted)}
.tag{font-size:10.5px;padding:0 6px;border-radius:4px;border:1px solid var(--line);color:var(--muted);margin-left:6px}

/* stats */
.controls{display:flex;flex-wrap:wrap;gap:8px;align-items:center;margin-bottom:16px}
.seg{display:inline-flex;border:1px solid var(--line);border-radius:7px;overflow:hidden;background:var(--card)}
.seg button{border:0;background:none;padding:5px 12px;cursor:pointer}
.seg button+button{border-left:1px solid var(--line)}
.seg button.on{background:var(--sel);font-weight:600}
.charts{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:12px;margin-top:12px}
@media (max-width:900px){.charts{grid-template-columns:1fr}}
.chart{padding:16px;position:relative;min-width:0}
.chart h3{font-size:13px;margin:0 0 6px}
.legend{display:flex;flex-wrap:wrap;gap:12px;font-size:11.5px;color:var(--fg2);margin-bottom:6px}
.legend i{display:inline-block;width:10px;height:10px;border-radius:2px;margin-right:5px;vertical-align:-1px}
.chart svg{display:block;width:100%;height:180px;overflow:visible}
.chart svg text{fill:var(--muted);font:10.5px var(--font)}
.chart .gridline{stroke:var(--grid)}
.tip{position:absolute;pointer-events:none;background:var(--card);border:1px solid var(--line);border-radius:8px;padding:6px 10px;font-size:12px;box-shadow:var(--shadow);white-space:nowrap;z-index:2}
.tip b{display:block;margin-bottom:2px}
.tip i{display:inline-block;width:8px;height:8px;border-radius:2px;margin-right:5px}
.tops{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:12px;margin-top:12px}
@media (max-width:900px){.tops{grid-template-columns:1fr}}
.tops h3{font-size:13px;margin:0;padding:14px 16px 6px}
.tops td{border-bottom:0;padding:6px 16px}
.tops td:first-child{max-width:360px;overflow:hidden;text-overflow:ellipsis}
.bar{height:4px;border-radius:2px;background:var(--c-in);opacity:.35;margin-top:3px}

/* tokens */
.toolbar{display:flex;gap:8px;flex-wrap:wrap;margin-bottom:12px}
.secret{padding:16px;margin-bottom:12px;border-color:var(--accent);display:grid;gap:8px}
</style>
</head>
<body>

<div class="app">
  <aside class="side">
    <div class="brand">tamsyam</div>
    <div class="server" title="Сервер"><span class="av" id="avatar">t</span><span id="srv">…</span></div>
    <nav class="nav">
      <div class="group">Сеть</div>
      <a href="#/start" data-p="start"><svg><use href="#i-rocket"/></svg>Начало работы</a>
      <a href="#/tunnels" data-p="tunnels"><svg><use href="#i-tunnel"/></svg>Туннели<span class="count" id="ntun"></span></a>
      <a href="#/stats" data-p="stats"><svg><use href="#i-chart"/></svg>Статистика</a>
      <div class="group">Доступ</div>
      <a href="#/tokens" data-p="tokens"><svg><use href="#i-key"/></svg>Токены</a>
      <a href="#/ports" data-p="ports"><svg><use href="#i-ports"/></svg>Порты</a>
    </nav>
    <div class="foot"><a href="https://github.com/Mi113r/tamsyam" target="_blank" class="muted">GitHub</a><span id="ver"></span></div>
  </aside>
  <main class="page" id="page"></main>
</div>

<div class="scrim" id="scrim" onclick="closeDrawer()"></div>
<aside class="drawer" id="drawer" aria-label="Туннель">
  <div class="dhead"><h3 id="dtitle">Туннель</h3><button class="iconbtn" onclick="closeDrawer()" aria-label="Закрыть"><svg><use href="#i-x"/></svg></button></div>
  <div class="dbody" id="dbody"></div>
</aside>
<div class="toast" id="toast"></div>

<script>
/* ---------- helpers ---------- */
const $ = id => document.getElementById(id);
const esc = s => String(s ?? '').replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const enc = encodeURIComponent;
const ago = t => { if (!t) return '—'; const s = Math.max(0, Math.round((Date.now() - new Date(t)) / 1000));
  return s < 60 ? s + ' с' : s < 3600 ? Math.round(s/60) + ' мин' : s < 86400 ? Math.round(s/3600) + ' ч' : Math.round(s/86400) + ' д'; };
const fmtNum = n => Number(n || 0).toLocaleString('ru-RU');
const fmtBytes = n => { n = n || 0; if (n < 1024) return n + ' Б';
  const u = ['КБ','МБ','ГБ','ТБ']; let i = -1; do { n /= 1024; i++; } while (n >= 1024 && i < u.length - 1);
  return (n < 10 ? n.toFixed(1) : Math.round(n)) + ' ' + u[i]; };
const fmtMs = ms => ms < 1000 ? Math.round(ms) + ' мс' : (ms / 1000).toFixed(1) + ' с';
const fmtDate = t => new Date(t).toLocaleString('ru-RU', {day: 'numeric', month: 'long', year: 'numeric', hour: '2-digit', minute: '2-digit'});
async function api(method, path, body) {
  // location.origin drops user:pass@ from the page URL, which fetch would reject.
  const r = await fetch(location.origin + path, {method, headers: body ? {'Content-Type':'application/json'} : {}, body: body && JSON.stringify(body)});
  if (!r.ok) throw new Error((await r.json().catch(() => ({}))).error || r.statusText);
  return r.status === 204 ? null : r.json();
}
function toast(msg) { const t = $('toast'); t.textContent = msg; t.classList.add('on'); clearTimeout(toast.h); toast.h = setTimeout(() => t.classList.remove('on'), 1600); }
async function copy(text) {
  try { await navigator.clipboard.writeText(text); toast('Скопировано'); }
  catch { toast('Не удалось скопировать'); }
}
const copyBtn = text => `<button class="iconbtn" title="Копировать" onclick="copy(decodeURIComponent('${enc(text)}'))"><svg><use href="#i-copy"/></svg></button>`;
// Shell-ish highlighting for command snippets.
const hl = cmd => esc(cmd).replace(/ (http|tcp|login|install)(?= |$)/g, ' <span class="k">$1</span>')
  .replace(/ (-{1,2}[a-z-]+)/g, ' <span class="f">$1</span>').replace(/ (\d{2,5})\b/g, ' <span class="n">$1</span>');
const snippet = cmd => `<div class="copy"><code>${hl(cmd)}</code>${copyBtn(cmd)}</div>`;

let info = {}, tunnels = [];
const serverURL = () => info.server || location.origin;

/* ---------- routing ---------- */
const pages = {start: renderStart, tunnels: renderTunnels, stats: renderStats, tokens: renderTokens, ports: renderPorts};
let page = '';
function route() {
  const p = (location.hash.replace(/^#\/?/, '').split('?')[0]) || 'start';
  page = pages[p] ? p : 'start';
  document.querySelectorAll('.nav a').forEach(a => a.classList.toggle('on', a.dataset.p === page));
  $('page').innerHTML = '';
  pages[page](true);
}
addEventListener('hashchange', route);

/* ---------- start ---------- */
let osTab = /Win/.test(navigator.platform) ? 'win' : 'unix';
const INSTALL = {
  win: 'irm https://raw.githubusercontent.com/Mi113r/tamsyam/main/install.ps1 | iex',
  unix: 'curl -fsSL https://raw.githubusercontent.com/Mi113r/tamsyam/main/install.sh | sh',
};
let newSecret = '';
function greeting() { const h = new Date().getHours();

/* ---------- tunnels ---------- */

    ? [['соединения', `${s.active_conns} / ${fmtNum(s.total_conns)}`], ['трафик', fmtBytes(s.bytes_in + s.bytes_out)], ['подключён', ago(t.connected_at)]]
    : [['запросы', `${fmtNum(s.requests)}${s.rpm ? ` · ${s.rpm} rpm` : ''}`], ['p50 / p90', s.requests ? `${fmtMs(s.p50_ms)} / ${fmtMs(s.p90_ms)}` : '—'], ['подключён', ago(t.connected_at)]];
}
function renderTunnels(first) {
  if (first) $('page').innerHTML = `<h1>Туннели</h1><p class="lead">Публичные точки подключения к локальным ресурсам. Нажмите на туннель, чтобы открыть детали и инспектор.</p><div class="tlist" id="tlist"></div>`;
  const list = [...tunnels].sort((a, b) => new Date(b.connected_at) - new Date(a.connected_at));

async function kick(key) { if (confirm(`Отключить ${key}?`)) { await api('DELETE', `/api/tunnels/${enc(key)}`); closeDrawer(); refresh(); } }

const kv = h => { const keys = Object.keys(h || {}).sort();
  return keys.length ? `<table class="kv">${keys.map(k => h[k].map(v => `<tr><td>${esc(k)}</td><td>${esc(v)}</td></tr>`).join('')).join('')}</table>` : '<div class="note">нет</div>'; };

async function showRequest(id) {

function copyCurl() {

  for (const [k, vs] of Object.entries(d.request_headers || {})) if (!skip.test(k)) vs.forEach(v => parts.push(`-H ${q(k + ': ' + v)}`));

/* ---------- statistics ---------- */
let statsRange = '24h', statsTunnel = '';

const RANGE_LABEL = {'1h': 'за час', '24h': 'за 24 часа', '7d': 'за 7 дней', '30d': 'за 30 дней'};
async function renderStats(first) {
  if (first) {
    const m = location.hash.match(/tunnel=([^&]+)/); if (m) statsTunnel = decodeURIComponent(m[1]);
    $('page').innerHTML = `<h1>Статистика</h1><p class="lead">Запросы, ошибки и трафик по всем туннелям. История хранится 30 дней.</p>

      <div class="tops"><div class="card"><h3>Популярные пути</h3><table id="topPaths"></table></div><div class="card"><h3>Клиенты (IP)</h3><table id="topIPs"></table></div></div>`;
    document.querySelectorAll('#ranges button').forEach(b => b.onclick = () => { statsRange = b.dataset.r; try { localStorage.setItem('tsm.range', statsRange); } catch {} renderStats(false); });

  let rep;
  try { rep = await api('GET', `/api/stats?range=${statsRange}&tunnel=${enc(statsTunnel)}`); }
  catch (e) { $('tiles').innerHTML = `<div class="card empty">${esc(e.message)}</div>`; return; }
  if (page !== 'stats') return;

  const keys = new Set(rep.tunnels); if (statsTunnel) keys.add(statsTunnel);
  $('stunnel').innerHTML = `<option value="">Все туннели</option>` + [...keys].sort().map(k => `<option ${k === statsTunnel ? 'selected' : ''}>${esc(k)}</option>`).join('');
  const t = rep.totals, errs = t.s4xx + t.s5xx;

    tile(fmtNum(t.requests), 'HTTP-запросов ' + RANGE_LABEL[rep.range]) +
    tile(t.requests ? (errs / t.requests * 100).toFixed(1) + '%' : '—', `ошибок · 4xx ${fmtNum(t.s4xx)} · 5xx ${fmtNum(t.s5xx)}`) +
    tile(t.requests ? fmtMs(t.dur_ms / t.requests) : '—', 'среднее время ответа') +
    tile(fmtNum(t.conns), 'TCP-соединений') +
    tile(fmtBytes(t.bytes_in + t.bytes_out), `трафик · вх ${fmtBytes(t.bytes_in)} · исх ${fmtBytes(t.bytes_out)}`) +
    tile(fmtNum(rep.unique_ips), 'уникальных IP');
  const buckets = fillBuckets(rep);
  stackedBars($('chReq'), 'Запросы по статусам', buckets, [
    {key: 's2xx', label: '2xx', color: 'var(--c-2xx)'}, {key: 's3xx', label: '3xx', color: 'var(--c-3xx)'},
    {key: 's4xx', label: '4xx', color: 'var(--c-4xx)'}, {key: 's5xx', label: '5xx', color: 'var(--c-5xx)'}], fmtNum, rep);
  lines($('chTraffic'), 'Трафик', buckets, [
    {key: 'bytes_in', label: 'входящий', color: 'var(--c-in)'}, {key: 'bytes_out', label: 'исходящий', color: 'var(--c-out)'}], fmtBytes, rep);
  const top = (rows, el) => { const max = rows.length ? rows[0].hits : 1;
    $(el).innerHTML = rows.length ? rows.map(r => `<tr><td title="${esc(r.value)}">${esc(r.value)}<div class="bar" style="width:${Math.max(2, r.hits / max * 100)}%"></div></td><td class="num">${fmtNum(r.hits)}</td></tr>`).join('')
      : `<tr><td class="empty">Нет данных</td></tr>`; };

}

const niceMax = v => { if (v <= 0) return 1; const p = Math.pow(10, Math.floor(Math.log10(v))); const n = v / p; return (n <= 1 ? 1 : n <= 2 ? 2 : n <= 5 ? 5 : 10) * p; };

  for (let k = 0; k < ticks; k++) { const i = Math.round(k * (n - 1) / Math.max(1, ticks - 1));
    svg += `<text x="${x(i) + slot / 2}" y="${H - 4}" text-anchor="${k === 0 ? 'start' : k === ticks - 1 ? 'end' : 'middle'}">${esc(fmtTick(buckets[i].t, rep))}</text>`; }

    tip.style.top = Math.max(4, ev.clientY - er.top - tip.offsetHeight - 10) + 'px';
  });
  hit.addEventListener('mouseleave', () => { tip.hidden = true; cross.setAttribute('visibility', 'hidden'); });
}
function stackedBars(el, title, buckets, series, fmtV, rep) {
  const maxV = Math.max(0, ...buckets.map(b => series.reduce((a, s) => a + b[s.key], 0)));
  chartFrame(el, title, buckets, series, maxV, fmtV, rep, ({x, y, slot}) => {
    const bw = Math.max(1, Math.min(18, slot * 0.7)), off = (slot - bw) / 2;
    let out = '';
    buckets.forEach((b, i) => { let acc = 0;
      series.forEach(s => { const v = b[s.key]; if (!v) return;
        const y1 = y(acc), y2 = y(acc + v), h = Math.max(1, y1 - y2 - (acc ? 2 : 0));
        out += `<rect x="${x(i) + off}" y="${y2}" width="${bw}" height="${h}" rx="${bw > 6 ? 2 : 0}" fill="${s.color}"/>`; acc += v; }); });
    return out;
  });
}
function lines(el, title, buckets, series, fmtV, rep) {
  const maxV = Math.max(0, ...buckets.flatMap(b => series.map(s => b[s.key])));
  chartFrame(el, title, buckets, series, maxV, fmtV, rep, ({x, y, slot}) =>
    series.map(s => `<polyline fill="none" stroke="${s.color}" stroke-width="2" stroke-linejoin="round" stroke-linecap="round"
      points="${buckets.map((b, i) => `${(x(i) + slot / 2).toFixed(1)},${y(b[s.key]).toFixed(1)}`).join(' ')}"/>`).join(''));
}
let resizeTimer; addEventListener('resize', () => { clearTimeout(resizeTimer); resizeTimer = setTimeout(() => page === 'stats' && renderStats(false), 200); });

/* ---------- tokens ---------- */
let tokenSecret = null;
async function renderTokens(first) {
  if (first) $('page').innerHTML = `<h1>Токены</h1><p class="lead">Токен подключает клиента <code>ts</code> к серверу. Отзыв токена сразу отключает его туннели.</p>
    <form class="toolbar" onsubmit="createToken(event)"><input id="tname" placeholder="имя, например laptop" required><button class="btn primary">Создать токен</button></form>
    <div id="secret"></div><div class="card tablewrap"><table id="tokens"></table></div>`;
  $('secret').innerHTML = tokenSecret ? `<div class="card secret"><b>Токен «${esc(tokenSecret.name)}» создан. Он показывается один раз.</b>
    <span class="muted">На машине разработчика выполните:</span>${snippet(`ts login ${serverURL()} ${tokenSecret.secret}`)}</div>` : '';
  const list = await api('GET', '/api/tokens');
  if (page !== 'tokens') return;
  $('tokens').innerHTML = list.length ? `<tr><th>Имя</th><th>Префикс</th><th>Создан</th><th>Использован</th><th></th></tr>` +
    list.map(t => `<tr><td>${esc(t.name)}</td><td class="muted">${esc(t.prefix)}…</td>
      <td class="muted">${ago(t.created_at)} назад</td><td class="muted">${t.last_used_at ? ago(t.last_used_at) + ' назад' : '—'}</td>
      <td class="num">${t.revoked ? '<span class="badge">отозван</span>' : `<button class="btn sm danger" onclick="revoke(${t.id})">Отозвать</button>`}</td></tr>`).join('')
    : `<tr><td class="empty">Создайте токен, чтобы подключить клиента</td></tr>`;
}
async function createToken(e) {
  e.preventDefault();
  try { const res = await api('POST', '/api/tokens', {name: $('tname').value}); tokenSecret = {name: res.token.name, secret: res.secret}; $('tname').value = ''; renderTokens(false); }
  catch (err) { toast(err.message); }
}
async function revoke(id) { if (confirm('Отозвать токен? Его туннели будут отключены.')) { await api('DELETE', `/api/tokens/${id}`); refresh(); } }

/* ---------- ports ---------- */
async function renderPorts(first) {
  if (first) $('page').innerHTML = `<h1>Порты</h1><p class="lead" id="portsLead"></p><div class="card tablewrap"><table id="reservations"></table></div>`;
  if (!info.tcp_ports) {
    $('portsLead').innerHTML = 'TCP-туннели на этом сервере выключены. Задайте <code>TAMSYAM_TCP_PORTS</code>, например <code>20000-20099</code>, и пробросьте этот диапазон на роутере.';
    $('reservations').innerHTML = ''; return;
  }
  $('portsLead').innerHTML = `Закреплённые порты TCP-туннелей. Диапазон сервера: <code>${esc(info.tcp_ports)}</code>. Порт закрепляется за токеном при запуске <code>ts tcp &lt;порт&gt; -p &lt;публичный&gt;</code>.`;
  const list = await api('GET', '/api/reservations');
  if (page !== 'ports') return;
  const live = new Set(tunnels.filter(t => t.proto === 'tcp').map(t => t.port));
  $('reservations').innerHTML = list.length ? `<tr><th>Порт</th><th>Адрес</th><th>Токен</th><th>Закреплён</th><th></th></tr>` +
    list.map(r => `<tr><td><b>${r.port}</b></td><td>${esc(info.domain)}:${r.port} ${live.has(r.port) ? '<span class="dot" title="туннель активен"></span>' : ''}</td>
      <td>${esc(r.token_name || '#' + r.token_id)}</td><td class="muted">${ago(r.created_at)} назад</td>
      <td class="num"><button class="btn sm danger" onclick="releasePort(${r.port})">Освободить</button></td></tr>`).join('')
    : `<tr><td class="empty">Закреплённых портов нет</td></tr>`;
}
async function releasePort(port) { if (confirm(`Освободить порт ${port}? Другой токен сможет его занять.`)) { await api('DELETE', `/api/reservations/${port}`); refresh(); } }

/* ---------- refresh loop ---------- */
async function refresh() {
  try {
    tunnels = await api('GET', '/api/tunnels');
    $('ntun').textContent = tunnels.length || '';
    if (page === 'tunnels') renderTunnels(false);
    if (page === 'ports') renderPorts(false);
    if (page === 'tokens' && !document.activeElement?.matches('input')) renderTokens(false);
    if (page === 'stats') renderStats();
    renderDrawer();
  } catch (e) { console.error(e); }
}
api('GET', '/api/info').then(i => {
  info = i;
  $('srv').textContent = i.domain; $('avatar').textContent = (i.domain || 't')[0].toUpperCase();
  $('ver').textContent = 'v' + i.version;
}).finally(async () => {
  try { tunnels = await api('GET', '/api/tunnels'); $('ntun').textContent = tunnels.length || ''; } catch {}
  if (!location.hash) location.hash = tunnels.length ? '#/tunnels' : '#/start'; else route();
  setInterval(refresh, 3000);
});
</script>
