version: 2

builds:
  - id: ts
    main: ./cmd/ts
    binary: ts
    env: [CGO_ENABLED=0]
    flags: [-trimpath]
    ldflags:
      - -s -w -X github.com/Mi113r/tamsyam/internal/protocol.Version={{ .Version }}
    goos: [linux, darwin, windows]
    goarch: [amd64, arm64]

  - id: tamsyam-server
    main: ./cmd/tamsyam-server
    binary: tamsyam-server
    env: [CGO_ENABLED=0]
    flags: [-trimpath]
    ldflags:
      - -s -w -X github.com/Mi113r/tamsyam/internal/protocol.Version={{ .Version }}
    goos: [linux]
    goarch: [amd64, arm64]

archives:
  - id: client
    ids: [ts]
    name_template: "tamsyam_{{ .Version }}_{{ .Os }}_{{ .Arch }}"
    formats: [tar.gz]
    format_overrides:
      - goos: windows
        formats: [zip]

  - id: server
    ids: [tamsyam-server]
    name_template: "tamsyam-server_{{ .Version }}_{{ .Os }}_{{ .Arch }}"
    formats: [tar.gz]
    files:
      - README.md
      - README.ru.md
      - DEPLOY.md
      - deploy/*

checksum:
  name_template: checksums.txt

changelog:
  sort: asc
  filters:
    exclude: ["^docs:", "^test:", "^ci:"]
